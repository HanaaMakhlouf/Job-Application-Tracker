<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Job Application Tracker</h1>
            <p>Create your account</p>
        </div>

        <form (ngSubmit)="submit()" class="auth-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" [(ngModel)]="name"
                    placeholder="Jane Smith" class="form-control" [disabled]="loading" />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email"
                    placeholder="you@example.com" class="form-control" [disabled]="loading" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password"
                    placeholder="Min. 6 characters" class="form-control" [disabled]="loading" />
            </div>

            <div *ngIf="error" class="alert alert-error">{{ error }}</div>

            <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
                {{ loading ? 'Creating account...' : 'Create Account' }}
            </button>
        </form>

        <p class="auth-footer">
            Already have an account? <a routerLink="/login">Sign in</a>
        </p>
    </div>
</div>
